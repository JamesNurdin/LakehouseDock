instanceName: lakehouse-h

namespace: pgr24james

trino:
  profiler: 
    enabled: false
    when: ['before']
  logger: false
  pod:
    image: 2570809n/trino-node-exporter:latest
  worker:
    resources:
      cpu: "4"
      memory: "16Gi"
    replicasPerNode: 1
    count: 2
    nodes:
      - "idagpu-12"
      - "idagpu-12"
  coord:
    resources:
      cpu: "4"
      memory: "16Gi"
    nodeName: "idagpu-10"  # or "" for random

test:
  pod:
    image: macavaney/idabox:py310-v93

metastore:
  nodeName: "idagpu-11"  # or "" for random 
  hive:
    pod:
      image: bde2020/hive:latest
  postgres:
    pod:
      image: postgres:13
    
pvc:
  iceberg:
    name: iceberg-10gb
    path: /mnt/iceberg

results:
  raw:
    name: lakehouse-raw-results-2
    path: /mnt/lakehouse-raw-results